[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++11
  -O2

[env:esp32c3_upgrade]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++11
  -O2
  -DBEACON_EXPERIMENTAL_UPGRADE=1
