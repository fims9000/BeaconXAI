name: BEACON robust donor replication on unseen UCI HAR training subjects

on:
  push:
    branches:
      - feature/contrastive-q16-20261119
    paths:
      - '.github/workflows/uci_har_robust_subject_replication.yml'
      - 'scripts/resplit_uci_har_train_subjects.py'
      - 'tests/test_resplit_uci_har_train_subjects.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  internal-fold:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - model: raw_mlp
            heldout: '1,3,5,6'
            tag: foldA_mlp
          - model: extratrees
            heldout: '1,3,5,6'
            tag: foldA_et
          - model: raw_mlp
            heldout: '7,8,11,14'
            tag: foldB_mlp
          - model: extratrees
            heldout: '7,8,11,14'
            tag: foldB_et
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and verify splitting rules and robustness criteria
        run: |
          python -m pip install -e . pytest matplotlib
          python -m pytest -q tests/test_resplit_uci_har_train_subjects.py \
            tests/test_donor_robust_cf.py tests/test_donor_selection.py
      - name: Prepare ORIGINAL official UCI HAR train/test NPZ
        run: |
          python scripts/preprocess_uci_har_for_q36.py \
            --root data/uci_har --out data/uci_har_official_subjects.npz
      - name: Re-split only the original TRAIN participants
        run: |
          python scripts/resplit_uci_har_train_subjects.py \
            --source data/uci_har_official_subjects.npz \
            --out data/uci_har_train_only_${{ matrix.tag }}.npz \
            --heldout '${{ matrix.heldout }}'
      - name: Compare donor-repair methods at Q16 on INTERNAL heldout subjects
        run: |
          python -u scripts/run_donor_robust_cf_benchmark.py \
            --npz-path data/uci_har_train_only_${{ matrix.tag }}.npz \
            --out-dir outputs_composite/robust_subject_${{ matrix.tag }} \
            --model ${{ matrix.model }} --budgets 16 \
            --max-test 96 --seed 57 --donors 8 --reserve 2
      - name: Store provenance
        if: always()
        run: |
          mkdir -p outputs_composite/robust_subject_${{ matrix.tag }}
          {
            git rev-parse HEAD
            python --version
            python -m pip freeze | grep -E 'numpy|scikit-learn|scipy|pandas|pytest'
            if test -f data/uci_har_train_only_${{ matrix.tag }}.npz; then sha256sum data/uci_har_train_only_${{ matrix.tag }}.npz; fi
          } > outputs_composite/robust_subject_${{ matrix.tag }}/provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robust-subject-${{ matrix.tag }}
          path: outputs_composite/robust_subject_${{ matrix.tag }}/
          retention-days: 30
          if-no-files-found: warn
