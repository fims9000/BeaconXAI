name: PAMAP2 verified counterfactual multi-component replication

on:
  push:
    branches:
      - feature/contrastive-q16-20261119
    paths:
      - '.github/workflows/pamap2_verified_counterfactual.yml'
      - 'beaconxai/cf_path_search.py'
      - 'scripts/run_verified_counterfactual_benchmark.py'
      - 'tests/test_cf_path_search.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  pamap2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - model: raw_mlp
            heldout: '8,9'
            tag: s8s9_mlp
          - model: extratrees
            heldout: '8,9'
            tag: s8s9_et
          - model: raw_mlp
            heldout: '2,3'
            tag: s2s3_mlp
          - model: extratrees
            heldout: '2,3'
            tag: s2s3_et
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and focused tests
        run: python -m pip install -e . pytest matplotlib
      - name: Verify target identity, budget and pruning
        run: python -m pytest -q tests/test_verified_counterfactual.py tests/test_cf_path_search.py
      - name: Prepare subject-disjoint PAMAP2
        run: |
          python scripts/preprocess_pamap2.py \
            --data-root data \
            --window-length 200 --step 100 --min-purity 0.95 \
            --test-subjects '${{ matrix.heldout }}' \
            --out data/pamap2_${{ matrix.tag }}.npz
      - name: Real target-class switches on held-out windows
        run: |
          python -u scripts/run_verified_counterfactual_benchmark.py \
            --npz-path data/pamap2_${{ matrix.tag }}.npz \
            --dataset PAMAP2 \
            --out-dir outputs_composite/pamap2_verified_${{ matrix.tag }} \
            --model ${{ matrix.model }} --budgets 8,16 --max-test 72 \
            --donors 8 --reserve 2 --seed 57
      - name: Preserve provenance
        if: always()
        run: |
          mkdir -p outputs_composite/pamap2_verified_${{ matrix.tag }}
          {
            git rev-parse HEAD
            python --version
            python -m pip freeze | grep -E 'numpy|scikit-learn|scipy|pandas|pytest'
            if test -f data/pamap2_${{ matrix.tag }}.npz; then sha256sum data/pamap2_${{ matrix.tag }}.npz; fi
          } > outputs_composite/pamap2_verified_${{ matrix.tag }}/provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pamap2-verified-${{ matrix.tag }}
          path: outputs_composite/pamap2_verified_${{ matrix.tag }}/
          retention-days: 30
          if-no-files-found: warn
