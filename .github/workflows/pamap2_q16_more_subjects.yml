name: PAMAP2 Q16 additional subject folds

on:
  push:
    branches:
      - feature/contrastive-q16-20261119
    paths:
      - '.github/workflows/pamap2_q16_more_subjects.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matched-q16-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - heldout: '2,3'
            tag: 's2s3'
          - heldout: '4,5'
            tag: 's4s5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e . pytest
      - name: Verify study code
        run: python -m pytest tests/test_q16_matched_ablation.py -q
      - name: Prepare official PAMAP2 fold
        run: |
          python scripts/preprocess_pamap2.py \
            --data-root data --window-length 200 --step 100 \
            --min-purity 0.95 --test-subjects '${{ matrix.heldout }}' \
            --out data/pamap2_${{ matrix.tag }}.npz
      - name: Matched Q16 ablation
        run: |
          python -u scripts/run_q16_matched_ablation.py \
            --npz-path data/pamap2_${{ matrix.tag }}.npz \
            --time-bins 12 --budget 16 --max-test 128 \
            --repeats 3 --seed 42 \
            --out-dir outputs_composite/q16_matched_${{ matrix.tag }}
      - name: Write manifest and dependency versions
        if: always()
        run: |
          mkdir -p outputs_composite/q16_matched_${{ matrix.tag }}
          {
            git rev-parse HEAD
            python --version
            python -m pip freeze | grep -E 'numpy|scikit-learn|scipy|pandas|pytest'
            if test -f data/pamap2_${{ matrix.tag }}.npz; then sha256sum data/pamap2_${{ matrix.tag }}.npz; fi
          } > outputs_composite/q16_matched_${{ matrix.tag }}/provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pamap2-q16-matched-${{ matrix.tag }}
          path: outputs_composite/q16_matched_${{ matrix.tag }}/
          retention-days: 30
          if-no-files-found: warn
