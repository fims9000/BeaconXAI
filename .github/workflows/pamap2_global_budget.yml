name: PAMAP2 global-budget evidence policy study

on:
  push:
    branches:
      - feature/contrastive-q16-20261119
    paths:
      - '.github/workflows/pamap2_global_budget.yml'
      - 'beaconxai/budget_policy.py'
      - 'scripts/run_global_budget_benchmark.py'
      - 'tests/test_budget_policy.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-rival:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - heldout: '2,3'
            tag: s2s3
          - heldout: '6,7'
            tag: s6s7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and tests
        run: python -m pip install -e . pytest matplotlib
      - name: Validate global-budget logic and donor invariants
        run: |
          python -m pytest -q tests/test_budget_policy.py tests/test_real_donor.py
      - name: Prepare official PAMAP2 subject split
        run: |
          python scripts/preprocess_pamap2.py \
            --data-root data --window-length 200 --step 100 \
            --min-purity 0.95 --test-subjects '${{ matrix.heldout }}' \
            --out data/pamap2_${{ matrix.tag }}.npz
      - name: Sequential one-object global Q16
        run: |
          python -u scripts/run_global_budget_benchmark.py \
            --npz-path data/pamap2_${{ matrix.tag }}.npz \
            --out-dir outputs_composite/global_budget_${{ matrix.tag }} \
            --q 16 --donor-kind medoid --time-bins 12 \
            --n-per-class 4 --n-errors 2 --max-samples 72 \
            --max-donors 32 --seed 42
      - name: Manifest with exact commit
        if: always()
        run: |
          mkdir -p outputs_composite/global_budget_${{ matrix.tag }}
          {
            git rev-parse HEAD
            python --version
            python -m pip freeze | grep -E 'numpy|scikit-learn|scipy|pandas|pytest'
          } > outputs_composite/global_budget_${{ matrix.tag }}/provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-budget-${{ matrix.tag }}
          path: outputs_composite/global_budget_${{ matrix.tag }}/
          if-no-files-found: warn
          retention-days: 30
