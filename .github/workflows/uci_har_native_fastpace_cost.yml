name: BEACON authentic FastPACE HCEM query-cost audit

on:
  push:
    branches:
      - feature/contrastive-q16-20261119
    paths:
      - '.github/workflows/uci_har_native_fastpace_cost.yml'
      - 'beaconxai/native_fastpace_meter.py'
      - 'tests/test_native_fastpace_meter.py'
      - 'scripts/run_native_fastpace_query_probe.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  metered-hcem:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [raw_mlp, extratrees]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and verify exact query instrumentation
        run: |
          python -m pip install -e . pytest matplotlib 'numpy<2'
          python -m pytest -q tests/test_native_fastpace_meter.py
      - name: Install authentic HCEM dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install stable-baselines3==2.6.0 gymnasium==1.1.1
      - name: Checkout immutable upstream FastPACE
        run: |
          git clone --depth 1 https://github.com/MarioRefoyo/FastPACE.git third_party/FastPACE
          test "$(git -C third_party/FastPACE rev-parse HEAD)" = "4bbeae86bbc6ad02f7ee79fb550c9866682f6deb"
          test -f third_party/FastPACE/methods/FastPACECF.py
      - name: Prepare official UCI HAR data
        run: |
          python scripts/preprocess_uci_har_for_q36.py \
            --root data/uci_har --out data/uci_har_official_subjects.npz
      - name: Test native HCEM with Q16 hard cap and reference-cost probe
        run: |
          python -u scripts/run_native_fastpace_query_probe.py \
            --npz-path data/uci_har_official_subjects.npz \
            --upstream third_party/FastPACE \
            --out-dir outputs_composite/fastpace_metered_${{ matrix.model }} \
            --model ${{ matrix.model }} --query-caps 16,4096 \
            --max-plan-calls 1 --max-test 9 --seed 57 \
            --beacon-reference
      - name: Preserve provenance
        if: always()
        run: |
          mkdir -p outputs_composite/fastpace_metered_${{ matrix.model }}
          {
            git rev-parse HEAD
            if test -d third_party/FastPACE/.git; then git -C third_party/FastPACE rev-parse HEAD; fi
            python --version
            python -m pip freeze | grep -E 'numpy|torch|stable-baselines3|gymnasium|scikit-learn|pytest'
            if test -f data/uci_har_official_subjects.npz; then sha256sum data/uci_har_official_subjects.npz; fi
          } > outputs_composite/fastpace_metered_${{ matrix.model }}/provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fastpace-metered-${{ matrix.model }}
          path: outputs_composite/fastpace_metered_${{ matrix.model }}/
          retention-days: 30
          if-no-files-found: warn
