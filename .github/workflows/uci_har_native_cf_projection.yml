name: BEACON native MultiSubSpaCE gravity projection falsification

on:
  push:
    branches:
      - feature/contrastive-q16-20261119
    paths:
      - '.github/workflows/uci_har_native_cf_projection.yml'
      - 'beaconxai/cf_physical_projection.py'
      - 'beaconxai/cf_group_sparse.py'
      - 'beaconxai/cf_budgeted_sparse_refine.py'
      - 'tests/test_cf_group_sparse.py'
      - 'tests/test_cf_budgeted_sparse_refine.py'
      - 'beaconxai/native_cf_projection.py'
      - 'tests/test_native_cf_projection.py'
      - 'tests/test_cf_physical_projection.py'
      - 'scripts/run_native_cf_projection_audit.py'
      - 'scripts/run_native_cf_baselines.py'
      - 'beaconxai/native_cf_budget.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  same-native-edits:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [raw_mlp, extratrees]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and unit test exact projection
        run: |
          python -m pip install -e . pytest matplotlib 'numpy<2'
          python -m pytest -q tests/test_cf_physical_projection.py \
            tests/test_native_cf_projection.py tests/test_native_cf_budget.py \
            tests/test_cf_group_sparse.py tests/test_cf_budgeted_sparse_refine.py
      - name: Checkout immutable native source
        run: |
          git clone --depth 1 https://github.com/MarioRefoyo/FastPACE.git third_party/FastPACE
          test "$(git -C third_party/FastPACE rev-parse HEAD)" = "4bbeae86bbc6ad02f7ee79fb550c9866682f6deb"
      - name: Prepare original official test participants
        run: |
          python scripts/preprocess_uci_har_for_q36.py \
            --root data/uci_har --out data/uci_har_official_subjects.npz
      - name: Audit actual target flips before and after affine projection within Q
        run: |
          python -u scripts/run_native_cf_projection_audit.py \
            --npz-path data/uci_har_official_subjects.npz \
            --upstream third_party/FastPACE \
            --out-dir outputs_composite/native_cf_projected_${{ matrix.model }} \
            --model ${{ matrix.model }} --budgets 8,16 --max-test 48 \
            --seed 57
      - name: Preserve provenance
        if: always()
        run: |
          mkdir -p outputs_composite/native_cf_projected_${{ matrix.model }}
          {
            git rev-parse HEAD
            if test -d third_party/FastPACE/.git; then git -C third_party/FastPACE rev-parse HEAD; fi
            python --version
            python -m pip freeze | grep -E 'numpy|scikit-learn|scipy|pandas|pytest'
            if test -f data/uci_har_official_subjects.npz; then sha256sum data/uci_har_official_subjects.npz; fi
          } > outputs_composite/native_cf_projected_${{ matrix.model }}/provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cf-project-${{ matrix.model }}
          path: outputs_composite/native_cf_projected_${{ matrix.model }}/
          retention-days: 30
          if-no-files-found: warn
