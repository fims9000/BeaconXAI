name: BEACON preregistered SpokenArabicDigits K3 donor transfer Q16

on:
  push:
    branches:
      - feature/contrastive-q16-20261119
    paths:
      - '.github/workflows/uea_spokenarabic_k3_transfer.yml'
      - 'scripts/preprocess_uea_spokenarabic.py'
      - 'scripts/run_uea_spokenarabic_k3_transfer.py'
      - 'tests/test_uea_spokenarabic_k3_transfer.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  preregistered-k3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned UEA reader and library
        run: |
          python -m pip install -e . pytest matplotlib aeon==1.5.0
      - name: Check exact shared Q16, unseen donors and source geometry
        run: |
          python -m pytest -q \
            tests/test_uea_spokenarabic_k3_transfer.py \
            tests/test_donor_robust_cf.py \
            tests/test_uea_natops_sparse_q16.py
      - name: Retrieve untouched official SpokenArabicDigits TRAIN and TEST
        run: |
          python -u scripts/preprocess_uea_spokenarabic.py \
            --out data/uea_spokenarabic_official.npz
      - name: Evaluate K2 and stress-K3 on 320 preselected TEST recordings
        run: |
          python -u scripts/run_uea_spokenarabic_k3_transfer.py \
            --npz-path data/uea_spokenarabic_official.npz \
            --out-dir outputs_composite/spokenarabic_k3_transfer \
            --seed 57 --trees 120 --donors 16
      - name: Record model, dataset and commit provenance
        if: always()
        run: |
          mkdir -p outputs_composite/spokenarabic_k3_transfer
          {
            git rev-parse HEAD
            git rev-parse a5474464981b6f8b2d5af13e95c69a9a09e5b642
            python --version
            python -m pip freeze | grep -E 'aeon|numpy|scikit-learn|scipy|pandas|pytest'
            if test -f data/uea_spokenarabic_official.npz; then sha256sum data/uea_spokenarabic_official.npz; fi
          } > outputs_composite/spokenarabic_k3_transfer/provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spokenarabic-preregistered-k3-transfer
          path: outputs_composite/spokenarabic_k3_transfer/
          retention-days: 90
          if-no-files-found: warn
