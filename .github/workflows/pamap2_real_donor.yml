name: Real-donor class-explanation benchmark

on:
  push:
    branches:
      - feature/contrastive-q16-20261119
    paths:
      - '.github/workflows/pamap2_real_donor.yml'
      - 'beaconxai/real_donor.py'
      - 'scripts/run_real_donor_benchmark.py'
      - 'tests/test_real_donor.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  donor-study:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - heldout: '2,3'
            tag: s2s3
          - heldout: '6,7'
            tag: s6s7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and tests
        run: python -m pip install -e . pytest matplotlib
      - name: Test research invariants
        run: |
          python -m pytest -q tests/test_real_donor.py tests/test_class_counterfactual.py
      - name: Prepare official PAMAP2 with held-out subjects
        run: |
          python scripts/preprocess_pamap2.py \
            --data-root data --window-length 200 --step 100 \
            --min-purity 0.95 --test-subjects '${{ matrix.heldout }}' \
            --out data/pamap2_${{ matrix.tag }}.npz
      - name: Run matched total Q16 donor benchmark
        run: |
          python -u scripts/run_real_donor_benchmark.py \
            --npz-path data/pamap2_${{ matrix.tag }}.npz \
            --out-dir outputs_composite/donor_${{ matrix.tag }} \
            --q 16 --time-bins 12 --n-per-class 5 --n-errors 2 \
            --max-samples 84 --max-donors 64 --seed 42
      - name: Record exact commit and dependency versions
        if: always()
        run: |
          mkdir -p outputs_composite/donor_${{ matrix.tag }}
          {
            git rev-parse HEAD
            python --version
            python -m pip freeze | grep -E 'numpy|scikit-learn|scipy|pandas|pytest'
          } > outputs_composite/donor_${{ matrix.tag }}/provenance.txt
      - name: Upload full results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-donor-${{ matrix.tag }}
          path: outputs_composite/donor_${{ matrix.tag }}/
          if-no-files-found: warn
          retention-days: 30
