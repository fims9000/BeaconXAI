name: Compile baseline BEACON adaptive_v2 Q16 with real MLP for ESP32-C3

on:
  push:
    branches:
      - feature/contrastive-q16-20261119
    paths:
      - '.github/workflows/esp32c3_adaptive_v2_firmware.yml'
      - 'embedded/adaptive_v2_firmware/**'
      - 'embedded/adaptive_v2_audit.hpp'
      - 'embedded/raw_mlp_inference.hpp'
      - 'embedded/staged_adaptive_upgrade.hpp'
      - 'beaconxai/staged_budget.py'
      - 'scripts/run_clean_calibrated_staged_budget.py'
      - 'beaconxai/cpp_mlp_export.py'
      - 'beaconxai/cpp_adaptive_v2_export.py'
      - 'scripts/export_raw_mlp_cpp.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python project and PlatformIO CLI
        run: python -m pip install -e . platformio
      - name: Prepare official subject-disjoint UCI HAR data
        run: |
          python scripts/preprocess_uci_har_for_q36.py \
            --root data/uci_har \
            --out data/uci_har_official_subjects.npz
      - name: Export real trained raw-input MLP, class profiles and board fixture
        run: |
          python scripts/export_raw_mlp_cpp.py \
            --npz-path data/uci_har_official_subjects.npz \
            --out-dir outputs_composite/esp32c3_model \
            --adaptive-parity --staged-parity --parity-samples 96 --seed 57
      - name: Stage versioned runtime and generated weights for ESP32-C3
        run: |
          set -eu
          mkdir -p embedded/adaptive_v2_firmware/include
          cp embedded/adaptive_v2_audit.hpp \
            embedded/adaptive_v2_firmware/include/
          cp embedded/raw_mlp_inference.hpp \
            embedded/adaptive_v2_firmware/include/
          cp embedded/staged_adaptive_upgrade.hpp \
            embedded/adaptive_v2_firmware/include/
          cp outputs_composite/esp32c3_model/beacon_mlp_model.hpp \
            embedded/adaptive_v2_firmware/include/
          cp outputs_composite/esp32c3_model/beacon_adaptive_profiles.hpp \
            embedded/adaptive_v2_firmware/include/
          cp outputs_composite/esp32c3_model/beacon_board_reference.hpp \
            embedded/adaptive_v2_firmware/include/
          cp outputs_composite/esp32c3_model/beacon_staged_policy.hpp \
            embedded/adaptive_v2_firmware/include/
          cp outputs_composite/esp32c3_model/beacon_board_staged_reference.hpp \
            embedded/adaptive_v2_firmware/include/
      - name: Cross-compile actual ESP32-C3 firmware (NO physical runtime)
        run: |
          pio run -d embedded/adaptive_v2_firmware -e esp32c3
          pio run -d embedded/adaptive_v2_firmware -e esp32c3 -t size
          pio run -d embedded/adaptive_v2_firmware -e esp32c3_upgrade
          pio run -d embedded/adaptive_v2_firmware -e esp32c3_upgrade -t size
      - name: Collect binary and build receipts
        if: always()
        run: |
          mkdir -p outputs_composite/esp32c3_firmware
          {
            git rev-parse HEAD
            python --version
            pio --version
            python -m pip freeze | grep -E 'numpy|scikit-learn|platformio'
            if test -f data/uci_har_official_subjects.npz; then
              sha256sum data/uci_har_official_subjects.npz
            fi
          } > outputs_composite/esp32c3_firmware/provenance.txt
          if test -f embedded/adaptive_v2_firmware/.pio/build/esp32c3/firmware.bin; then
            cp embedded/adaptive_v2_firmware/.pio/build/esp32c3/firmware.bin \
              outputs_composite/esp32c3_firmware/
            cp embedded/adaptive_v2_firmware/.pio/build/esp32c3/firmware.elf \
              outputs_composite/esp32c3_firmware/
            (cd outputs_composite/esp32c3_firmware && \
              sha256sum firmware.bin > firmware.sha256)
            if test -f embedded/adaptive_v2_firmware/.pio/build/esp32c3/firmware.map; then
              cp embedded/adaptive_v2_firmware/.pio/build/esp32c3/firmware.map \
                outputs_composite/esp32c3_firmware/
            fi
          fi
          if test -f embedded/adaptive_v2_firmware/.pio/build/esp32c3_upgrade/firmware.bin; then
            cp embedded/adaptive_v2_firmware/.pio/build/esp32c3_upgrade/firmware.bin \
              outputs_composite/esp32c3_firmware/firmware_upgrade.bin
            cp embedded/adaptive_v2_firmware/.pio/build/esp32c3_upgrade/firmware.elf \
              outputs_composite/esp32c3_firmware/firmware_upgrade.elf
            (cd outputs_composite/esp32c3_firmware && \
              sha256sum firmware_upgrade.bin > firmware_upgrade.sha256)
            if test -f embedded/adaptive_v2_firmware/.pio/build/esp32c3_upgrade/firmware.map; then
              cp embedded/adaptive_v2_firmware/.pio/build/esp32c3_upgrade/firmware.map \
                outputs_composite/esp32c3_firmware/firmware_upgrade.map
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32c3-adaptive-v2-q16-compile-only
          path: outputs_composite/esp32c3_firmware/
          if-no-files-found: warn
          retention-days: 30
