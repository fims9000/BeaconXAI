name: UCI HAR matched counterfactual operators on one frozen model

on:
  push:
    branches:
      - feature/contrastive-q16-20261119
    paths:
      - '.github/workflows/uci_har_matched_cf_operators.yml'
      - 'scripts/run_matched_cf_operators.py'
      - 'beaconxai/physical_groups.py'
      - 'beaconxai/verified_counterfactual.py'
      - 'beaconxai/cf_path_search.py'
      - 'tests/test_matched_cf_operators.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  matched:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        model: [raw_mlp, extratrees]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test
        run: |
          python -m pip install -e . pytest matplotlib
          python -m pytest -q tests/test_matched_cf_operators.py \
            tests/test_physical_groups.py tests/test_verified_counterfactual.py \
            tests/test_cf_path_search.py
      - name: Download official subject-disjoint UCI HAR
        run: |
          python scripts/preprocess_uci_har_for_q36.py \
            --root data/uci_har --out data/uci_har_official_subjects.npz
      - name: Run Q8 Q16 with identical frozen model and target donors across three operators
        run: |
          python -u scripts/run_matched_cf_operators.py \
            --npz-path data/uci_har_official_subjects.npz \
            --out-dir outputs_composite/uci_har_matched_${{ matrix.model }} \
            --model ${{ matrix.model }} --max-test 180 --seed 57 \
            --donors 8 --reserve 2 --budgets 8,16
      - name: Preserve provenance
        if: always()
        run: |
          mkdir -p outputs_composite/uci_har_matched_${{ matrix.model }}
          {
            git rev-parse HEAD
            python --version
            python -m pip freeze | grep -E 'numpy|scikit-learn|scipy|pandas|pytest'
            if test -f data/uci_har_official_subjects.npz; then sha256sum data/uci_har_official_subjects.npz; fi
          } > outputs_composite/uci_har_matched_${{ matrix.model }}/provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uci-har-matched-${{ matrix.model }}
          path: outputs_composite/uci_har_matched_${{ matrix.model }}/
          retention-days: 30
          if-no-files-found: warn
