name: BEACON PAMAP2 fixed and selective Q8 Q16 Q32 frontier

on:
  push:
    branches:
      - feature/contrastive-q16-20261119
    paths:
      - '.github/workflows/pamap2_budget_frontier.yml'
      - 'scripts/run_calibrated_q_gate.py'
      - 'beaconxai/query_gate.py'
      - 'beaconxai/subject_sampling.py'
      - 'tests/test_query_gate.py'
      - 'tests/test_subject_sampling.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - heldout: '2,3'
            tag: s2s3
          - heldout: '4,5'
            tag: s4s5
          - heldout: '6,7'
            tag: s6s7
          - heldout: '8,9'
            tag: s8s9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e . pytest
      - name: Test subject separation and budget accounting
        run: python -m pytest -q tests/test_query_gate.py tests/test_subject_sampling.py tests/test_q16_matched_ablation.py
      - name: Prepare official data once per outer fold
        run: |
          python scripts/preprocess_pamap2.py \
            --data-root data --window-length 200 --step 100 \
            --min-purity 0.95 --test-subjects '${{ matrix.heldout }}' \
            --out data/pamap2_${{ matrix.tag }}.npz
      - name: Run same-seed Q8 Q16 Q32 matched sweep
        run: |
          for q in 8 16 32; do
            penalty=$(python -c 'import sys; print(0.05*float(sys.argv[1])/16)' "$q")
            python -u scripts/run_calibrated_q_gate.py \
              --npz-path data/pamap2_${{ matrix.tag }}.npz \
              --out-dir outputs_composite/frontier_${{ matrix.tag }}/q${q} \
              --budget "$q" --lambda-cost "$penalty" \
              --max-test 256 --seed 42
          done
      - name: Assemble cost-quality frontier with explicit Q labels
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          root=Path('outputs_composite/frontier_${{ matrix.tag }}')
          rows=[]
          for q in (8, 16, 32):
              m=json.loads((root/f'q{q}'/'manifest.json').read_text())
              a=m['outer']
              rows.append(dict(q_full=q, n=a['n_samples'],
                  subject_macro_hit3_q0=a['subject_macro_hit3_q0'],
                  subject_macro_hit3_full_q=a['subject_macro_hit3_q16'],
                  subject_macro_hit3_selective=a['subject_macro_hit3_gate'],
                  subject_macro_mean_selective_q=a['subject_macro_mean_queries'],
                  subject_macro_utility_selective=a['subject_macro_utility'],
                  selected_gate=str(m['chosen_gate']),
                  min_injected_windows_per_subject=min(m['outer_injected_windows_per_subject'].values()),
                  outer_subject_counts=str(m['outer_injected_windows_per_subject'])))
          with (root/'frontier.csv').open('w',newline='') as f:
              writer=csv.DictWriter(f,fieldnames=list(rows[0]))
              writer.writeheader()
              writer.writerows(rows)
          print(json.dumps(rows,indent=2))
          PY
      - name: Record exact commit and environment
        if: always()
        run: |
          mkdir -p outputs_composite/frontier_${{ matrix.tag }}
          {
            git rev-parse HEAD
            python --version
            python -m pip freeze | grep -E 'numpy|scikit-learn|scipy|pandas|pytest'
          } > outputs_composite/frontier_${{ matrix.tag }}/provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q-frontier-${{ matrix.tag }}
          path: outputs_composite/frontier_${{ matrix.tag }}/
          if-no-files-found: warn
          retention-days: 30
