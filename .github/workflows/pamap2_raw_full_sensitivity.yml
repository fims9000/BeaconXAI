name: PAMAP2 raw-input MLP full-Q36 sensitivity replication

on:
  push:
    branches:
      - feature/contrastive-q16-20261119
    paths:
      - '.github/workflows/pamap2_raw_full_sensitivity.yml'
      - 'scripts/run_full_sensitivity_reference.py'
      - 'tests/test_full_sensitivity_reference.py'
      - 'beaconxai/sensitivity_reference.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  raw-mlp-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - heldout: '2,3'
            tag: s2s3
          - heldout: '8,9'
            tag: s8s9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e . pytest
      - name: Verify raw model and reference protocol
        run: python -m pytest -q tests/test_full_sensitivity_reference.py tests/test_sensitivity_reference.py
      - name: Prepare official subject-held-out PAMAP2
        run: |
          python scripts/preprocess_pamap2.py \
            --data-root data --window-length 200 --step 100 \
            --min-purity 0.95 --test-subjects '${{ matrix.heldout }}' \
            --out data/pamap2_${{ matrix.tag }}.npz
      - name: Fit raw MLP and compare Q0 Q16 with full Q36
        run: |
          python -u scripts/run_full_sensitivity_reference.py \
            --npz-path data/pamap2_${{ matrix.tag }}.npz \
            --out-dir outputs_composite/raw_mlp_q36_${{ matrix.tag }} \
            --model raw_mlp --max-test 64 --time-bins 12 \
            --budget 16 --seed 57
      - name: Provenance
        if: always()
        run: |
          mkdir -p outputs_composite/raw_mlp_q36_${{ matrix.tag }}
          {
            git rev-parse HEAD
            python --version
            python -m pip freeze | grep -E 'numpy|scikit-learn|scipy|pytest'
            if test -f data/pamap2_${{ matrix.tag }}.npz; then sha256sum data/pamap2_${{ matrix.tag }}.npz; fi
          } > outputs_composite/raw_mlp_q36_${{ matrix.tag }}/provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-mlp-q36-${{ matrix.tag }}
          path: outputs_composite/raw_mlp_q36_${{ matrix.tag }}/
          retention-days: 30
          if-no-files-found: warn
