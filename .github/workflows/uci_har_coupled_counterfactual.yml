name: UCI HAR coupled-acceleration counterfactual falsification

on:
  push:
    branches:
      - feature/contrastive-q16-20261119
    paths:
      - '.github/workflows/uci_har_coupled_counterfactual.yml'
      - 'beaconxai/physical_groups.py'
      - 'beaconxai/verified_counterfactual.py'
      - 'scripts/run_verified_counterfactual_benchmark.py'
      - 'tests/test_physical_groups.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  coupled-uci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: [raw_mlp, extratrees]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and focused tests
        run: python -m pip install -e . pytest matplotlib
      - name: Verify coupled edits and hard model evaluation accounting
        run: |
          python -m pytest -q tests/test_physical_groups.py \
            tests/test_verified_counterfactual.py tests/test_cf_path_search.py
      - name: Prepare original UCI HAR official subject split
        run: |
          python scripts/preprocess_uci_har_for_q36.py \
            --root data/uci_har --out data/uci_har_official_subjects.npz
      - name: Verify actual target flips with coupled body-total acceleration
        run: |
          python -u scripts/run_verified_counterfactual_benchmark.py \
            --npz-path data/uci_har_official_subjects.npz \
            --dataset UCI_HAR --coupled-uci-har \
            --out-dir outputs_composite/uci_har_coupled_${{ matrix.model }} \
            --model ${{ matrix.model }} --budgets 8,16 --max-test 180 \
            --donors 8 --reserve 2 --seed 57
      - name: Provenance
        if: always()
        run: |
          mkdir -p outputs_composite/uci_har_coupled_${{ matrix.model }}
          {
            git rev-parse HEAD
            python --version
            python -m pip freeze | grep -E 'numpy|scikit-learn|scipy|pandas|pytest'
            if test -f data/uci_har_official_subjects.npz; then sha256sum data/uci_har_official_subjects.npz; fi
          } > outputs_composite/uci_har_coupled_${{ matrix.model }}/provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uci-har-coupled-${{ matrix.model }}
          path: outputs_composite/uci_har_coupled_${{ matrix.model }}/
          retention-days: 30
          if-no-files-found: warn
